name: Ufuq
options:
  bundleIdPrefix: app.ufuq
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  UfuqCore:
    path: UfuqCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    # Release workflow overrides these from VERSION and the run number.
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sparkle EdDSA public key. Empty in dev/CI builds: the updater stays off.
    # The release workflow passes it from the repo variable SPARKLE_PUBLIC_KEY.
    SPARKLE_PUBLIC_KEY: ""
targets:
  Ufuq:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources/Assets.xcassets
      # mediaremote-adapter, built by CI into this folder (gitignored); absent in local builds.
      - path: App/Resources/MediaRemoteAdapter
        type: folder
        optional: true
    dependencies:
      - package: UfuqCore
      - package: Sparkle
      # The Claude Code hook helper, embedded at Contents/MacOS/ufuq-hook.
      - target: ufuq-hook
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Ufuq
        CFBundleDisplayName: Ufuq
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: "https://github.com/hystericmoon/ufuq/releases/latest/download/appcast.xml"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_KEY)"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Ufuq"
        NSLocalNetworkUsageDescription: "Ufuq shares usage and agent status with your paired phone over your local network."
        NSAppleEventsUsageDescription: "Ufuq shows and controls the song playing in Spotify."
        NSCalendarsFullAccessUsageDescription: "Ufuq shows your upcoming meetings and Join links in the notch."
        NSCalendarsUsageDescription: "Ufuq shows your upcoming meetings and Join links in the notch."
        NSSpeechRecognitionUsageDescription: "Ufuq transcribes voice notes and audio files on-device."
        NSMicrophoneUsageDescription: "Ufuq listens only while you are recording a voice note."
        NSBonjourServices:
          - _ufuq._tcp
        NSServices:
          - NSMenuItem:
              default: "Add to Ufuq Tray"
            NSMessage: addToTray
            NSPortName: Ufuq
            NSSendTypes:
              - public.file-url
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.ufuq.mac
        PRODUCT_NAME: Ufuq
  ufuq-hook:
    type: tool
    platform: macOS
    sources:
      - UfuqCore/Sources/UfuqHook
    dependencies:
      - package: UfuqCore
    settings:
      base:
        PRODUCT_NAME: ufuq-hook
        SKIP_INSTALL: YES
  UfuqTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - App/Tests
    dependencies:
      - target: Ufuq
      - package: UfuqCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.ufuq.mac.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ufuq:
    build:
      targets:
        Ufuq: all
        UfuqTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UfuqTests
