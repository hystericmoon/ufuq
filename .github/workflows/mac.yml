name: Mac app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4 if present
        run: if [ -d /Applications/Xcode_16.4.app ]; then sudo xcode-select -s /Applications/Xcode_16.4.app; fi
      - name: Show toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        env:
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
        run: >
          xcodebuild -scheme Ufuq -destination 'platform=macOS' -configuration Debug
          CODE_SIGNING_ALLOWED=NO build test
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: warn
