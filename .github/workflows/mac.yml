name: Mac app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Xcode 26 builds Liquid Glass (macOS 26 SDK); the app still runs on macOS 14+.
      - name: Select Xcode 26 if present, else 16.4
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$X" ] && [ -d /Applications/Xcode_16.4.app ]; then X=/Applications/Xcode_16.4.app; fi
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build mediaremote-adapter
        run: |
          set -euo pipefail
          ADAPTER_TAG=v0.9.1
          git clone --depth 1 --branch "$ADAPTER_TAG" https://github.com/ungive/mediaremote-adapter.git "$RUNNER_TEMP/mra"
          cmake -S "$RUNNER_TEMP/mra" -B "$RUNNER_TEMP/mra/build"
          cmake --build "$RUNNER_TEMP/mra/build"
          DEST=App/Resources/MediaRemoteAdapter
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP/mra/bin/mediaremote-adapter.pl" "$DEST/"
          cp -R "$RUNNER_TEMP/mra/build/MediaRemoteAdapter.framework" "$DEST/"
          cp "$RUNNER_TEMP/mra/build/MediaRemoteAdapterTestClient" "$DEST/"
          cp "$RUNNER_TEMP/mra/LICENSE" "$DEST/LICENSE-mediaremote-adapter.txt"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        env:
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
        run: >
          xcodebuild -scheme Ufuq -destination 'platform=macOS' -configuration Debug
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build test
      - name: Check the embedded ufuq-hook helper
        run: |
          HOOK="build/Build/Products/Debug/Ufuq.app/Contents/MacOS/ufuq-hook"
          test -x "$HOOK" || { echo "missing $HOOK"; find build/Build/Products -name 'ufuq-hook*'; exit 1; }
          DIR=$(mktemp -d)
          echo '{"hook_event_name":"UserPromptSubmit","session_id":"ci-session","cwd":"/tmp/ci-project"}' \
            | UFUQ_AGENT_DIR="$DIR" "$HOOK"
          echo "exit $?"
          ls -l "$DIR"
          ls "$DIR"/*.json
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: warn
