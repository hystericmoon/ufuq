name: Android

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Kotlin core tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      # JDK 21 like Adwam's CI; the bytecode targets Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-core-reports
          path: android/core/build/reports/tests/

  app:
    name: App tests, lint, debug APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 37
        shell: bash
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-app-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: ufuq-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Record screenshots (Linux render, for review)
        run: ./gradlew :app:recordRoborazziDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: android/app/src/test/screenshots/*.png
